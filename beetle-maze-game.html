<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beetle Maze Game - Mad Lad Games</title>
    <link rel="stylesheet" href="beetle-maze-game/style.css">
</head>
<body>
    <div class="game-container">
        <h1>🚗 Beetle Maze Adventure</h1>
        <div class="info-panel">
            <div class="info-item">Level: <span id="level">1</span></div>
            <div class="info-item">Time: <span id="time">0</span>s</div>
            <div class="info-item">🪙 Coins: <span id="gems">0</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <p>🎮 Use Arrow Keys to move the Beetle through the maze!</p>
            <p>Collect all coins 🪙 to advance to the next level</p>
            <button id="restartBtn">Restart Level</button>
        </div>
        <div id="gameOverScreen" class="screen hidden">
            <h2>Level Complete! 🎉</h2>
            <p>Time: <span id="finalTime">0</span>s</p>
            <button id="nextLevelBtn">Next Level</button>
        </div>
    </div>
    <script src="beetle-maze-game/game.js"></script>
</body>
</html>
